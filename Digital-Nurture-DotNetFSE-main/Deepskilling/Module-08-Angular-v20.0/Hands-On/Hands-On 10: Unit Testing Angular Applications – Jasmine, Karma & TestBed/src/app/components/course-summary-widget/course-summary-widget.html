<div class="stats-card card-glass">
  <div class="stats-icon enrolled-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/></svg>
  </div>
  <div class="stats-info">
    <span class="stats-label">Active Courses</span>
    <h2 class="stats-value">{{ enrolledCoursesCount() }}</h2>
    <span class="stats-trend">{{ completedCoursesCount() }} Completed</span>
  </div>
</div>

<div class="stats-card card-glass">
  <div class="stats-icon credits-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 17V7h5a3 3 0 0 1 0 6H9"/></svg>
  </div>
  <div class="stats-info">
    <span class="stats-label">Registered Credits</span>
    <h2 class="stats-value">{{ totalCredits() }}</h2>
    <span class="stats-trend positive">+3 credits transfer pending</span>
  </div>
</div>

<div class="stats-card card-glass">
  <div class="stats-icon progress-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
  </div>
  <div class="stats-info">
    <span class="stats-label">Overall Completion</span>
    <h2 class="stats-value">{{ overallProgress() }}%</h2>
    <div class="progress-container" style="margin-top: 8px;">
      <div class="progress-bar" [style.width.%]="overallProgress()"></div>
    </div>
  </div>
</div>
