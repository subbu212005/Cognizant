<header class="header">
  <div class="header-container">
    <div class="logo-area" routerLink="/home">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-graduation-cap"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M6 18.8 6 12"/><path d="M18 18.8v-5.8"/><path d="M6 12v3a6 6 0 0 0 12 0v-3"/></svg>
      </div>
      <span class="logo-text">EduPortal</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Dashboard</span>
      </a>

      <!-- Protected Links -->
      <ng-container *ngIf="isLoggedIn()">
        <a routerLink="/courses" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
          <span>Courses</span>
        </a>
        <a routerLink="/enrollment/enroll" routerLinkActive="active" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M5 12h14m-7-7v14"/></svg>
          <span>Enroll Course</span>
        </a>
        <a routerLink="/enrollment/reactive-enroll" routerLinkActive="active" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Reactive Enroll</span>
        </a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </a>
      </ng-container>
    </nav>

    <!-- Auth Widget Area -->
    <div class="auth-widget-area">
      <ng-container *ngIf="isLoggedIn(); else loggedOutWidget">
        <div class="user-profile-widget" routerLink="/profile">
          <div class="user-info">
            <span class="user-greeting">Welcome back,</span>
            <span class="user-name">{{ student().name }}</span>
          </div>
          <div class="avatar-container">
            <img [src]="student().avatar" [alt]="student().name" class="avatar-img">
            <span class="status-indicator"></span>
          </div>
        </div>
        <button class="btn-logout" (click)="logout()" title="Sign Out">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logout-icon"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </ng-container>

      <ng-template #loggedOutWidget>
        <button class="btn btn-primary btn-login" (click)="login()">Sign In</button>
      </ng-template>
    </div>
  </div>
</header>
